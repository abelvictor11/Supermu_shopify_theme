name: Sync staging with main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# staging is protected (pull requests only, no force-push), so this workflow
# never pushes to it: it opens or reuses a main -> staging pull request.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    name: Open sync pull request main -> staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main staging
          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "staging ya contiene main; no hay nada que sincronizar." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh pr list --repo "$REPO" --base staging --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Ya hay un PR de sincronización abierto: #$existing (se actualiza solo con cada push a main)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="Abierto automáticamente tras un push a main. Lleva a staging los cambios de main sin sobrescribir lo que solo existe en staging. Si hay conflictos, resuélvelos en este PR."
          if gh pr create --repo "$REPO" --base staging --head main --title "chore: sincronizar staging con main" --body "$body"; then
            echo "PR de sincronización creado." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "No se pudo crear el PR automáticamente."
              echo "Activa *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*,"
              echo "o ábrelo a mano: https://github.com/$REPO/compare/staging...main?expand=1"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::No se pudo abrir el PR main -> staging; ver el resumen del job."
          fi
